[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatrud-anomaly"
version = "0.1.0"
description = "Isolation Forest and percentile-based geochemical anomaly detection for stream sediment data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "openpyxl",
]

[project.optional-dependencies]
notebook = ["jupyter", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]
